<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Navinha Arcade v2.2</title><meta name="theme-color" content="#020611"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gameShell"><aside class="desktop-panel left"><b>NAVINHA ARCADE</b><span>WASD / Setas</span><span>Espaço: disparar</span><span>P: pausar</span><span>O: ajustes</span></aside><div id="gameViewport"><canvas id="pixiCanvas" width="480" height="720" aria-hidden="true"></canvas><canvas id="gameCanvas" width="480" height="720"></canvas></div><aside class="desktop-panel right"><b>MISSÃO</b><span>10 fases</span><span>Chefes multiestágio</span><span>Resgates + estrelas</span><span>Power-ups especiais</span></aside></div><script>if (window.matchMedia && window.matchMedia("(min-width: 980px)").matches) { document.getElementById("gameCanvas").width = 1024; document.getElementById("pixiCanvas").width = 1024; }</script>

<!--
  O jogo é dividido em módulos dentro de js/, carregados em ordem de
  dependência com <script src>. Isso continua funcionando com duplo
  clique (abrindo o index.html direto no navegador, sem servidor),
  diferente de módulos ES6 (import/export), que exigem um servidor
  por causa das regras de CORS do navegador para o protocolo file://.
-->
<script src="js/core.js"></script>
<!-- O manifesto é leve. Os arquivos completos das fases agora são inseridos
     pelo AssetManager somente quando o jogador inicia a missão. -->
<script src="js/phase-manifest.js"></script>
<script src="js/audio.js"></script>
<script src="js/asset-manager.js"></script>
<script src="js/ship-sprites.js"></script>
<script src="js/powerup-sprites.js"></script>
<script src="js/effect-sprites.js"></script>
<script src="js/environment-sprites.js"></script>
<script src="js/loading-screen.js"></script>
<script src="js/save-manager.js"></script>
<script src="js/levels.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/rescue.js"></script>
<script src="js/upgrades.js"></script>
<script src="js/ui.js"></script>
<script src="js/enhancements.js"></script>
<script src="js/v12.js"></script>
<!-- PixiJS é carregado em segundo plano somente em http/https. Em file:// ou
     sem WebGL, o Canvas 2D permanece como fallback automático. -->
<script src="js/pixi-renderer.js"></script>
<script src="js/game.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
